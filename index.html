<style>
/* ============================================================
   Harper Family Hub — design tokens
   Ported from the "scorer's book" design system.
   Rules that matter: separate with `rule`, not shadow; one
   `--signal` per screen; one `--shadow-raise` per screen;
   grotesk to operate, serif to talk, mono to measure.
   ============================================================ */
:root {
  /* surfaces */
  --paper: #e7eae0;
  --paper-sheet: #f5f6f0;
  --paper-sunk: #dde1d6;
  /* ink */
  --ink: #1a231e;
  --ink-muted: #4a544b;
  --ink-faint: #5d665e;
  --rule: rgba(26,35,30,0.15);
  --rule-strong: rgba(26,35,30,0.35);
  /* identity */
  --field: #2f5d46;
  --field-tint: #d9e4da;
  --signal: #b0452a;
  --signal-tint: #f3ddd3;
  --chalk: #46647b;
  --chalk-tint: #d7e2ea;
  --brass: #856224;
  --brass-tint: #ece0c4;
  /* state — never accents */
  --ok: #2f6b43;
  --warn: #8a6310;
  --crit: #9c3320;
  --focus: #b0452a;
  --on-field: #f5f6f0;
  /* type */
  --font-grotesk: "Familjen Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-serif: Literata, Georgia, "Times New Roman", serif;
  --font-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
  /* scale */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-sm: 3px; --radius-md: 6px; --radius-lg: 10px; --radius-pill: 999px;
  --shadow-raise: 0 1px 2px rgba(26,35,30,0.08), 0 8px 20px rgba(26,35,30,0.08);
  --shadow-bar: 0 -1px 0 rgba(26,35,30,0.15);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151916;
    --paper-sheet: #1d231f;
    --paper-sunk: #0f1311;
    --ink: #eef0e8;
    --ink-muted: #a3aca4;
    --ink-faint: #7b857d;
    --rule: rgba(238,240,232,0.16);
    --rule-strong: rgba(238,240,232,0.40);
    --field: #6fa583;
    --field-tint: #22332a;
    --signal: #e0785a;
    --signal-tint: #3a241c;
    --chalk: #86aac4;
    --chalk-tint: #1f2c36;
    --brass: #d0a552;
    --brass-tint: #322916;
    --ok: #77b98c;
    --warn: #dcae4e;
    --crit: #ef8a6c;
    --focus: #e0785a;
    --on-field: #121a15;
    --shadow-raise: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.42);
    --shadow-bar: 0 -1px 0 rgba(238,240,232,0.16);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-grotesk);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.45;
  padding: var(--space-4) var(--space-4) calc(76px + env(safe-area-inset-bottom));
}
.page { max-width: 640px; margin: 0 auto; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-sm); }

/* ---------- header ---------- */
header { margin-bottom: var(--space-5); }
.header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.eyebrow {
  display: inline-block;
  font-size: 11px; line-height: 12px; font-weight: 700; letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--field); background: var(--field-tint);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
}
h1 { font-size: 34px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em; margin-top: var(--space-3); text-wrap: balance; }
.subtitle { color: var(--ink-muted); font-size: 12.5px; line-height: 17px; margin-top: var(--space-2); }
.icon-btn {
  border: 1px solid var(--rule-strong); background: none; color: var(--ink-muted);
  min-width: 44px; min-height: 44px;
  border-radius: var(--radius-md); font-size: 16px; cursor: pointer;
}
.sync-note {
  font-family: var(--font-mono);
  font-size: 11px; line-height: 14px; letter-spacing: 0.04em;
  color: var(--ink-faint); margin-top: var(--space-2); min-height: 14px;
  font-variant-numeric: tabular-nums;
}

/* ---------- section heads ---------- */
h2 {
  font-size: 11px; line-height: 12px; font-weight: 700; letter-spacing: 0.11em;
  text-transform: uppercase; color: var(--ink-faint);
  display: flex; align-items: center; gap: var(--space-3);
  margin: var(--space-6) 0 var(--space-3);
}
h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
h2 .hint { letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--ink-faint); }

/* ---------- ledger blocks: rules, not cards ---------- */
.block { border-top: 1px solid var(--rule); }
h2 + .block { border-top: 0; }
.block > *:last-child { border-bottom-color: var(--rule-strong); }

/* button chrome reset — declared BEFORE the surfaces so they set the background */
.tappable {
  background: none; border: 0; font: inherit; color: inherit;
  cursor: pointer; width: 100%; text-align: left; display: block;
}
.tappable .muted { display: block; }

/* Two surface tiers. A .sheet is an object at rest; a .lineup is the one
   thing on the screen that is happening now. Peers take the same tier —
   a lifted surface beside a flat one implies a hierarchy that isn't there. */
.sheet {
  background: var(--paper-sheet);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
}
.lineup {
  background: var(--paper-sheet);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-raise);
  padding: var(--space-4);
  margin-bottom: var(--space-4);
}
.lineup h3, .ttl-lg { font-size: 18px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em; margin-top: var(--space-2); display: block; }
.lineup .muted, .sheet .muted { margin-top: var(--space-1); }

.muted { color: var(--ink-muted); font-size: 12.5px; line-height: 17px; }
.tiny  { color: var(--ink-faint); font-size: 11.5px; line-height: 16px; }
.empty { color: var(--ink-muted); font-size: 14px; line-height: 20px; padding: var(--space-3) 0; border-bottom: 1px solid var(--rule); }
.empty.good { color: var(--ok); font-weight: 500; }

/* ---------- markers ---------- */
.marker {
  display: inline-block;
  font-size: 11px; line-height: 12px; font-weight: 700; letter-spacing: 0.11em;
  text-transform: uppercase;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
}
.marker.now { background: var(--signal-tint); color: var(--signal); }
.marker.scheduled { background: var(--chalk-tint); color: var(--chalk); }
.marker.team { background: var(--field-tint); color: var(--field); }
.marker.ceremony { background: var(--brass-tint); color: var(--brass); }

/* ---------- buttons ---------- */
button.primary, button.ghost, button.danger {
  font-family: var(--font-grotesk); font-size: 14px; line-height: 20px; font-weight: 500;
  border-radius: var(--radius-md); padding: 11px 18px; min-height: 44px;
  cursor: pointer; border: 1px solid transparent; background: none;
}
button.primary { background: var(--field); color: var(--on-field); }
button.ghost { border-color: var(--rule-strong); color: var(--ink); }
button.danger { border-color: var(--crit); color: var(--crit); }
button[disabled] { opacity: .45; cursor: default; }
.actions { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-top: var(--space-4); }

/* ---------- form controls ---------- */
input[type=text], input[type=password], input[type=url], input[type=time], input[type=date], input[type=number], select, textarea {
  font-family: var(--font-grotesk); font-size: 16px; /* 16px: stops iOS zooming on focus */
  color: var(--ink);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  width: 100%;
  min-height: 44px;
}
textarea { resize: vertical; min-height: 64px; font-family: var(--font-serif); font-size: 16px; line-height: 25px; }
label.f {
  display: block;
  font-size: 11px; line-height: 12px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase;
  color: var(--ink-muted); margin: var(--space-4) 0 var(--space-2);
}

/* ---------- notification settings ---------- */
.nrow { padding: var(--space-3) 0; border-bottom: 1px solid var(--rule); }
.ncheck { display: flex; gap: var(--space-3); align-items: flex-start; cursor: pointer; min-height: 44px; }
.ncheck input { width: 20px; height: 20px; accent-color: var(--field); flex: 0 0 20px; margin-top: 1px; cursor: pointer; }
.ncheck .ttl { font-size: 16px; line-height: 22px; font-weight: 500; }
.ncheck .tiny { display: block; font-weight: 400; margin-top: 2px; }
.nwhen { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; margin: var(--space-2) 0 0 calc(20px + var(--space-3)); }
.nwhen input, .nwhen select { width: auto; min-width: 120px; }
.nwhen select { min-width: 88px; }

/* ---------- the initial dot ---------- */
.chip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 600;
  background: var(--paper-sunk); color: var(--ink-muted);
  flex: 0 0 26px;
}
.chip.Family { background: var(--field-tint); color: var(--field); }

/* ---------- ruled rows: events, tasks, meals ---------- */
.ev, .task, .meal {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--rule);
  min-height: 44px;
}
.ev .dot { width: 8px; height: 8px; border-radius: var(--radius-pill); flex: 0 0 8px; }
.ev .time {
  font-family: var(--font-mono); font-size: 13px; line-height: 18px; font-weight: 500;
  color: var(--ink-muted); flex: 0 0 66px; font-variant-numeric: tabular-nums;
}
.ev .etitle { font-size: 16px; line-height: 22px; font-weight: 500; flex: 1; min-width: 0; }
.ev .cal { display: block; font-size: 12.5px; line-height: 17px; font-weight: 400; color: var(--ink-muted); }

.dayhead {
  font-size: 18px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em;
  margin: var(--space-6) 0 var(--space-2);
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
}

.task input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--field); flex: 0 0 20px; cursor: pointer; }
.task .ttl { flex: 1; min-width: 0; font-size: 16px; line-height: 22px; font-weight: 500; }
.task.done .ttl { text-decoration: line-through; color: var(--ink-faint); }
.task.done .ttl .tiny { text-decoration: none; }
.task .del {
  background: none; border: none; color: var(--ink-faint);
  font-size: 18px; cursor: pointer; padding: var(--space-2); min-width: 44px; min-height: 44px;
  border-radius: var(--radius-md);
}
/* ---------- adding a task: title, then who / due / repeat ---------- */
.addform { display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
.addrow { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.addrow > select, .addrow > input[type=date] { flex: 1 1 120px; width: auto; min-width: 0; }
.addrow > input[type=time] { flex: 1 1 104px; width: auto; min-width: 0; }
.addrow > .ghost { flex: 0 0 auto; padding: 8px 14px; }
.addrow > input[type=number] { width: 72px; }
.addrow .grow { flex: 1; min-width: 0; }
.daypick { display: flex; gap: var(--space-1); flex-wrap: wrap; }
.daypick label { position: relative; cursor: pointer; }
.daypick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.daypick span {
  display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
  border-radius: var(--radius-pill); border: 1px solid var(--rule-strong);
  font-size: 13px; font-weight: 600; color: var(--ink-muted);
}
.daypick input:checked + span { background: var(--field); border-color: var(--field); color: var(--on-field); }
.daypick input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

/* due date and repeat under a task's title */
.task .ttl .meta { display: block; font-size: 12.5px; line-height: 17px; font-weight: 400; color: var(--ink-muted); margin-top: 2px; }
.task.done .ttl .meta { text-decoration: none; }
.task .ttl .meta .overdue { color: var(--crit); font-weight: 500; }
details.later > summary {
  cursor: pointer; list-style: none; font-size: 14px; line-height: 20px; font-weight: 500;
  padding: var(--space-3) 0; color: var(--ink-muted); min-height: 44px; display: flex; align-items: center; gap: var(--space-2);
}
details.later > summary::-webkit-details-marker { display: none; }
details.later > summary::before { content: "\25B8"; color: var(--ink-faint); font-size: 11px; }
details.later[open] > summary::before { content: "\25BE"; }

/* a task's title is the way into editing it */
.task .tedit {
  align-self: stretch; text-align: left; background: none; border: 0; padding: 0;
  font: inherit; color: inherit; cursor: pointer; border-radius: var(--radius-sm);
}
.task .tedit:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* a subtask sits under its parent, indented past the parent's tick */
.task.sub { margin-left: 30px; }
.task.sub .ttl { font-size: 15px; }

/* a reminder's subtasks, folded under it and indented past its tick and dot */
.task.has-subs { border-bottom: 0; }
details.subs { border-bottom: 1px solid var(--rule); padding: 0 0 var(--space-1) calc(20px + 26px + var(--space-3) * 2); }
details.subs > summary {
  cursor: pointer; list-style: none; min-height: 44px; margin-top: calc(var(--space-3) * -1);
  display: flex; align-items: center; gap: var(--space-2);
  font-size: 12.5px; line-height: 17px; font-weight: 500; color: var(--ink-muted);
}
details.subs > summary::-webkit-details-marker { display: none; }
details.subs > summary::before { content: "\25B8"; color: var(--ink-faint); font-size: 11px; }
details.subs[open] > summary::before { content: "\25BE"; }
details.subs .task { padding: var(--space-2) 0; }
details.subs .task:last-child { border-bottom: 0; }
/* a Hub task's subtasks fold the same way; its rows keep their own indent */
details.subs.tsubs { padding-left: 0; }
details.subs.tsubs > summary { padding-left: 30px; }
details.subs.tsubs .task.sub { padding: var(--space-2) 0; }

.meal .d {
  flex: 0 0 44px;
  font-family: var(--font-mono); font-size: 11px; line-height: 14px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint);
}
.meal.today { background: var(--signal-tint); margin-inline: calc(var(--space-2) * -1); padding-inline: var(--space-2); border-radius: var(--radius-sm); }
.meal.today .d { color: var(--signal); }
.meal { align-items: flex-start; }
.meal .d { margin-top: 15px; } /* centred on the 44px field, even with a recipe link below it */
.meal .mealbody { flex: 1; min-width: 0; }
.recipe {
  display: inline-flex; align-items: center; min-height: 32px; max-width: 100%;
  font-size: 12.5px; line-height: 17px; font-weight: 500; color: var(--field);
  text-decoration: underline; text-underline-offset: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.recipes { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.grocery-add { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-3); }
.grocery-add textarea {
  flex: 1; min-width: 0; min-height: 44px; height: 44px; resize: none; overflow: hidden;
  font-family: var(--font-grotesk); line-height: 22px;
}
.task label.ttl { cursor: pointer; }
.grip {
  flex: 0 0 28px; min-height: 44px; margin-left: calc(var(--space-2) * -1);
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; color: var(--ink-faint); cursor: grab;
  touch-action: none; -webkit-user-select: none; user-select: none; border-radius: var(--radius-sm);
}
.grip-space { flex: 0 0 28px; margin-left: calc(var(--space-2) * -1); }
.grocery-list .task { transition: transform .15s ease; }
.grocery-list .task.dragging, .task.dragging {
  transition: none; position: relative; z-index: 5; cursor: grabbing;
  background: var(--paper-sheet); box-shadow: var(--shadow-raise); border-radius: var(--radius-sm);
}
.task.dragging[data-tid] { opacity: .92; } /* the drop line and target show through */
.task.dragging-sub, details.subs.dragging-sub { position: relative; z-index: 4; background: var(--paper-sheet); opacity: .85; }
.task.drop-into { background: var(--field-tint); border-radius: var(--radius-sm); }
.drop-line { position: absolute; z-index: 6; height: 3px; margin-top: -2px; border-radius: 2px; background: var(--field); pointer-events: none; }
/* while a task is dragged: where it can go, and what dropping it would do */
.td-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: var(--paper-sheet); box-shadow: var(--shadow-bar);
  padding: calc(var(--space-2) + env(safe-area-inset-top)) var(--space-4) var(--space-3);
}
.td-hint { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-muted); min-height: 18px; margin-bottom: var(--space-2); }
.td-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
.td-chip {
  min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center;
  border: 1px dashed var(--rule-strong); border-radius: var(--radius-md);
  font-size: 13px; line-height: 17px; font-weight: 600; color: var(--ink-muted);
}
.td-chip.on { background: var(--field-tint); border: 1px solid var(--field); color: var(--field); }
.td-chip.off { opacity: .4; }
@media (prefers-reduced-motion: reduce) { .grocery-list .task { transition: none; } }
.lineup .recipes { margin-top: var(--space-1); }

/* ---------- prompts: the serif marks the shift to talking ---------- */
.q { display: flex; gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--rule); }
.q .num {
  flex: 0 0 24px;
  font-family: var(--font-mono); font-size: 13px; line-height: 28px; font-weight: 500;
  color: var(--ink-faint); font-variant-numeric: tabular-nums;
}
.q .body { flex: 1; min-width: 0; }
.q .body p {
  font-family: var(--font-serif); font-size: 19px; line-height: 28px; font-weight: 400;
  color: var(--ink); margin-bottom: var(--space-2); text-wrap: pretty;
}
.q .body .tiny {
  font-family: var(--font-serif); font-style: italic;
  font-size: 14px; line-height: 21px; color: var(--ink-muted);
  margin: calc(var(--space-1) * -1) 0 var(--space-2);
}

.hist { border-bottom: 1px solid var(--rule); padding: var(--space-3) 0; }
.hist summary {
  cursor: pointer; font-size: 14px; line-height: 20px; font-weight: 500;
  list-style: none; display: flex; gap: var(--space-2); align-items: baseline;
  min-height: 24px;
}
.hist summary::-webkit-details-marker { display: none; }
.hist summary::before { content: "\25B8"; color: var(--ink-faint); font-size: 11px; }
.hist[open] summary::before { content: "\25BE"; }
.hist .ans {
  font-family: var(--font-serif); font-size: 16px; line-height: 25px;
  margin: var(--space-2) 0 var(--space-1) var(--space-5);
}
.hist .ans b {
  display: block; font-family: var(--font-grotesk);
  font-size: 11px; line-height: 12px; font-weight: 700; letter-spacing: 0.11em;
  color: var(--ink-faint); text-transform: uppercase;
  margin-top: var(--space-4); margin-bottom: var(--space-1);
}

/* ---------- bottom nav: the thumb index ---------- */
nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--paper-sheet);
  box-shadow: var(--shadow-bar);
  display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-1);
  padding: var(--space-2) var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom));
  z-index: 20;
}
nav button {
  background: none; border: none; cursor: pointer;
  font-family: var(--font-grotesk); font-size: 12.5px; line-height: 17px; font-weight: 500;
  color: var(--ink-muted);
  display: flex; align-items: center; justify-content: center;
  min-height: 44px; padding: var(--space-2) var(--space-1);
  border-radius: var(--radius-md);
}
nav button.active { color: var(--field); background: var(--field-tint); font-weight: 600; }

/* ---------- overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 30;
  background: var(--paper);
  overflow-y: auto;
  padding: var(--space-5) var(--space-4) calc(var(--space-7) + env(safe-area-inset-bottom));
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="page" id="app">
  <header>
    <div class="header-row">
      <span class="eyebrow" id="todayEyebrow">Harper Family Hub</span>
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙</button>
    </div>
    <h1 id="viewTitle">Today</h1>
    <div class="sync-note" id="syncNote"></div>
  </header>
  <main id="main"></main>
</div>

<nav id="nav"></nav>

<div class="overlay hidden" id="overlay">
  <div class="page" id="overlayPage"></div>
</div>

<script>
"use strict";

/* ============ state ============ */
const FAMILY = ["Jon", "Maggie", "Clayton", "Heidi", "Family"];
const RECURS = ["once", "daily", "weekly", "monthly", "quarterly", "yearly"];
const RECUR_LABEL = { once: "One-off", daily: "Daily", weekly: "Weekly", monthly: "Monthly", quarterly: "Quarterly", yearly: "Yearly" };
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const HUDDLE_FIELDS = [
  ["rose",  "Rose / Thorn / Bud", "Everyone shares a high, a low, and something they're looking forward to"],
  ["week",  "Week ahead", "Calendar Captain walks the week — practices, events, lunch menu peek"],
  ["chores","Home team check", "How did chores go? Any trades for this week?"],
  ["fun",   "Fun pick", "Fun Picker chooses one family thing for the week"],
  ["grat",  "Gratitude & prayer", "Close with one gratitude each"]
];
const COUPLES_QUESTIONS = [
  "What are you grateful for and appreciate about me this week?",
  "What brought you joy this week?",
  "What is something that was hard this week?",
  "What is one thing I can do for you this week?",
  "Is there any unconfessed sin, conflict, or hurt that we need to resolve and/or seek forgiveness for?",
  "What is a dream, craving, or desire that has been on the forefront of your mind?",
  "How can I pray for you this week?"
];

let DATA = { tasks: [], meals: {}, events: [], checkins: [], groceries: [] };
/* Whether the backend that last answered predates times and subtasks: its tasks
   have no parentId. Set only from live answers, never from the copy saved on
   this device, which can be older than the backend. */
let OLD_BACKEND = false;
function noteBackend(tasks) {
  OLD_BACKEND = Array.isArray(tasks) && tasks.some(t => !("parentId" in t));
  // Shown or cleared straight away, even when a redraw is held back for a draft.
  const w = document.getElementById("oldBackend"), form = document.querySelector("#main .addform");
  if (!OLD_BACKEND && w) w.remove();
  if (OLD_BACKEND && !w && form && VIEW === "tasks") form.insertAdjacentHTML("afterend", oldBackendHtml());
}
function oldBackendHtml() {
  return `<div class="block" id="oldBackend"><div class="empty" style="color:var(--warn)">Times, subtasks and moving tasks won't save yet: the Apps Script backend is an older version. Paste the latest Apps Script files and publish a new version.</div></div>`;
}
let VIEW = "today";
let POLL = null;

const cfg = {
  get api()  { return localStorage.getItem("fd_api") || ""; },
  get pin()  { return localStorage.getItem("fd_pin") || ""; },
  get user() { return localStorage.getItem("fd_user") || "Jon"; },
};

/* ============ networking ============ */
async function apiGet(action, withReminders) {
  const r = await fetch(cfg.api + "?action=" + (action || "all") + "&pin=" + encodeURIComponent(cfg.pin) + (withReminders ? "&reminders=1" : ""));
  return r.json();
}
async function apiPost(body) {
  body.pin = cfg.pin;
  const r = await fetch(cfg.api, { method: "POST", body: JSON.stringify(body) });
  return r.json();
}

async function refresh(quiet) {
  if (!cfg.api || !cfg.pin) { showSetup(); return; }
  if (!quiet) note("Syncing…");
  try {
    const d = await apiGet("all", REM.show);
    if (!d.ok) { note(d.error === "bad_pin" ? "Wrong PIN — check Settings" : "Sync error"); return; }
    DATA = { tasks: d.tasks || [], meals: d.meals || {}, events: d.events || [], checkins: d.checkins || [],
             groceries: d.groceries, // undefined until the backend has the grocery list
             reminders: REM.show ? d.reminders : undefined }; // never kept on a device that hides them
    localStorage.setItem("fd_cache", JSON.stringify(DATA));
    noteBackend(d.tasks);
    note("Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    if (hasUnsavedEdits()) { note("Synced — your unsaved edits are kept"); return; }
    render();
  } catch (e) {
    note("Offline — showing last saved");
  }
}

async function send(body) {
  note("Saving…");
  try {
    const d = await apiPost(body);
    if (d.ok) {
      if (d.tasks) noteBackend(d.tasks);
      DATA.tasks = d.tasks || DATA.tasks;
      DATA.meals = d.meals || DATA.meals;
      DATA.checkins = d.checkins || DATA.checkins;
      DATA.groceries = d.groceries; // an older backend leaves this out, and the page says so
      localStorage.setItem("fd_cache", JSON.stringify(DATA));
      note("Saved ✓");
    } else { note("Save failed"); }
  } catch (e) { note("Save failed — offline?"); }
  render();
}

function note(t) { document.getElementById("syncNote").textContent = t; }

/* ============ drafts (survive refreshes & app switches) ============ */
function draftKey() {
  if (VIEW === "meals") return "fd_draft_meals";
  if (VIEW === "checkins" && CHECKIN_OPEN) return "fd_draft_" + CHECKIN_OPEN;
  if (VIEW === "tasks") return "fd_draft_task";
  return null;
}
function saveDraft(e) {
  // Only typed text is a draft: not the grocery box, and not ticking a checkbox.
  if (e && e.target && (e.target.type === "checkbox" || (e.target.dataset && e.target.dataset.nodraft))) return;
  const key = draftKey(); if (!key) return;
  const d = {};
  document.querySelectorAll("#main input[type=text], #main textarea, #main select").forEach(el => { if (el.id && !el.dataset.nodraft) d[el.id] = el.value; });
  if (Object.values(d).some(v => v && v.trim && v.trim())) localStorage.setItem(key, JSON.stringify(d));
  else localStorage.removeItem(key);
}
function restoreDraft() {
  const key = draftKey(); if (!key) return;
  let d = {}; try { d = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
  Object.entries(d).forEach(([id, v]) => { const el = document.getElementById(id); if (el && v) el.value = v; });
}
function clearDraft(key) { localStorage.removeItem(key); }
function hasUnsavedEdits() {
  if (DRAG || TD) return true; // mid-drag: a background refresh would pull the row out from under the finger
  const key = draftKey();
  if (!key) return false;
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest("#main") &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return true;
  return !!localStorage.getItem(key);
}

/* ============ helpers ============ */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayLabel(iso) {
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
}
/* Recipe links typed into a dinner: show the dinner's name, and each link
   as a short tappable site name instead of the whole address. */
const URL_RE = /https?:\/\/[^\s<>"']+/gi; // iOS often capitalises the first letter typed
function mealParts(text) {
  const links = (String(text || "").match(URL_RE) || []).map(u => u.replace(/[).,;!?]+$/, ""));
  const name = String(text || "").replace(URL_RE, " ").replace(/\s+/g, " ").replace(/^[\s\-–—:|,(]+|[\s\-–—:|,(]+$/g, "");
  return { name, links };
}
function recipeLinks(links) {
  if (!links.length) return "";
  return `<div class="recipes">${links.map(u => {
    let site = u;
    try { site = new URL(u).hostname.replace(/^www\./, ""); } catch (e) {}
    return `<a class="recipe" href="${esc(u)}" target="_blank" rel="noopener">${esc(site)} ↗</a>`;
  }).join("")}</div>`;
}
function mealLinks(input) {
  const box = document.getElementById(input.id + "-links");
  if (box) box.innerHTML = recipeLinks(mealParts(input.value).links);
}

function chip(name) {
  const initial = (name || "?").slice(0, 1);
  return name ? `<span class="chip ${esc(name)}" title="${esc(name)}">${initial}</span>` : "";
}
function eventRow(e) {
  const time = e.allDay ? "All day" : e.start;
  return `<div class="ev"><span class="dot" style="background:${esc(e.color)}"></span>
    <span class="time">${esc(time)}</span>
    <span class="etitle">${esc(e.title)}<span class="cal">${esc(e.cal)}</span></span></div>`;
}
const GRIP_SVG = `<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true" fill="currentColor">
  <circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/>
  <circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg>`;
/* A task and its subtasks, folded under it like Jon's reminders. (Not taskRow(t, i): it's used with .map.) */
function taskRow(t) {
  const subs = isSub(t) ? [] : subsOf(t.id).sort(subOrder);
  if (!subs.length) return taskLine(t, false, false);
  const id = esc(t.id), left = subs.filter(x => !x.completed).length;
  const label = left === subs.length ? `${left} subtask${left === 1 ? "" : "s"}` : left ? `${left} of ${subs.length} subtasks left` : "All subtasks done";
  return taskLine(t, false, true) + `<details class="subs tsubs" data-for="${id}" ontoggle="foldTask(this.dataset.for, !this.open)" ${FOLDED.has(t.id) ? "" : "open"}>
    <summary>${label}</summary>${subs.map(s => taskLine(s, true, false)).join("")}</details>`;
}
/* Folded tasks, remembered on this device. Open is the default, as in Reminders. */
const FOLDED = new Set((() => { try { return JSON.parse(localStorage.getItem("fd_task_folded") || "[]"); } catch (e) { return []; } })());
function foldTask(id, folded) {
  if (FOLDED.has(id) === folded) return;
  folded ? FOLDED.add(id) : FOLDED.delete(id);
  // forget tasks that are gone, so the list doesn't grow forever
  [...FOLDED].forEach(x => { if (!taskById(x)) FOLDED.delete(x); });
  try { localStorage.setItem("fd_task_folded", JSON.stringify([...FOLDED])); } catch (e) {}
}
function taskLine(t, sub, hasSubs) {
  const id = esc(t.id);
  // Dragging lives on the Tasks screen, where the rows sit in order.
  const grip = VIEW !== "tasks" ? ""
    : t.completed || String(t.id).startsWith("tmp-") ? `<span class="grip-space"></span>`
    : `<button class="grip" data-tgrip="${id}" aria-label="Move ${esc(t.title)} (arrow keys; right makes it a subtask, left takes it out)"
        onpointerdown="tdStart(event, '${id}')" onpointermove="tdMove(event)"
        onpointerup="tdEnd(false)" onpointercancel="tdEnd(true)" onkeydown="tdKey(event, '${id}')">${GRIP_SVG}</button>`;
  return `<div class="task ${t.completed ? "done" : ""} ${sub ? "sub" : ""} ${hasSubs ? "has-subs" : ""}" data-tid="${id}" ${sub ? `data-parent="${esc(t.parentId)}"` : ""}>
    ${grip}
    <input type="checkbox" ${t.completed ? "checked" : ""} onchange="toggleTask('${id}')" aria-label="${esc(t.title)}">
    ${chip(t.assignee)}
    <button type="button" class="ttl tedit" onclick="openTaskEdit('${id}')" aria-label="Edit ${esc(t.title)}">${esc(t.title)}${t.completed && t.completedBy ? ` <span class="tiny">by ${esc(t.completedBy)}</span>` : ""}${taskMeta(t)}</button>
    <button class="del" onclick="deleteTask('${id}')" aria-label="Delete">×</button>
  </div>`;
}

/* ---------- due dates and Apple Reminders-style repeats ----------
   A repeat is stored as text the server also reads: "every 2 weeks",
   "every 1 week on sun,tue,thu", "every 3 months on 3rd sat". */
const WD = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const WD_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const NTH = { "1st": 1, first: 1, "2nd": 2, second: 2, "3rd": 3, third: 3, "4th": 4, fourth: 4, "5th": 5, fifth: 5, last: -1 };
const NTH_WORD = { 1: "first", 2: "second", 3: "third", 4: "fourth", 5: "fifth", "-1": "last" };
const NTH_CODE = { 1: "1st", 2: "2nd", 3: "3rd", 4: "4th", 5: "5th", "-1": "last" };

function parseRepeat(text) {
  const m = String(text || "").trim().toLowerCase().match(/^every\s+(\d+)\s+(day|week|month|year)s?(?:\s+on\s+(.+))?$/);
  if (!m) return null;
  const r = { n: Math.max(1, Number(m[1])), unit: m[2] };
  if (r.unit === "week" && m[3]) {
    const days = m[3].split(/[\s,]+/).filter(Boolean).map(d => WD.indexOf(d.slice(0, 3)));
    if (!days.length || days.includes(-1)) return null; // same rule as the server
    r.days = [...new Set(days)].sort();
  }
  if (r.unit !== "week" && r.unit !== "day" && m[3]) {
    const p = m[3].match(/^(\w+)\s+(\w{3})/);
    if (p && p[1] in NTH && WD.includes(p[2])) r.nth = { k: NTH[p[1]], wd: WD.indexOf(p[2]) };
  }
  return r;
}
/* Worded like Apple Reminders: "Weekly", "Every 2 weeks", "Every 3 months on the third Saturday". */
function describeRepeat(text, due) {
  const r = parseRepeat(text);
  if (!r) return text;
  const plural = { day: "days", week: "weeks", month: "months", year: "years" }[r.unit];
  const base = r.n === 1 ? { day: "Daily", week: "Weekly", month: "Monthly", year: "Yearly" }[r.unit] : `Every ${r.n} ${plural}`;
  if (r.unit === "week" && r.days && r.days.length) {
    if (r.n === 1 && r.days.join() === "1,2,3,4,5") return "Every weekday";
    return `${base} on ${r.days.map(d => WD_LONG[d].slice(0, 3)).join(", ")}`;
  }
  if (r.nth) {
    const on = `the ${NTH_WORD[r.nth.k]} ${WD_LONG[r.nth.wd]}`;
    if (r.unit === "year") {
      const month = due ? new Date(due + "T12:00:00").toLocaleDateString("en-US", { month: "long" }) : "";
      return `${r.n === 1 ? "Every year" : base} on ${on}${month ? " of " + month : ""}`;
    }
    return `${base} on ${on}`;
  }
  return base;
}
function dueInfo(due) {
  if (!due) return null;
  const d = new Date(due + "T12:00:00"), t = new Date(todayStr() + "T12:00:00");
  const days = Math.round((d - t) / 86400000);
  const text = days === 0 ? "Today" : days === 1 ? "Tomorrow" : days === -1 ? "Yesterday"
    : days > 1 && days < 7 ? d.toLocaleDateString("en-US", { weekday: "long" })
    : d.toLocaleDateString("en-US", d.getFullYear() === t.getFullYear() ? { month: "numeric", day: "numeric" } : { month: "numeric", day: "numeric", year: "2-digit" });
  return { text, days };
}
function taskMeta(t) {
  const due = dueInfo(t.due), parts = [];
  if (due) {
    const late = isLate(t);
    // a repeating task ticked today has already moved on to its next date
    const text = (t.completed && t.repeat ? "Next: " : "") + due.text + (t.time ? " · " + fmtTime(t.time) : "");
    parts.push(`<span class="${late ? "overdue" : ""}">${esc(text)}${late ? " · overdue" : ""}</span>`);
  }
  if (t.repeat) parts.push(`<span>↻ ${esc(describeRepeat(t.repeat, t.due))}</span>`);
  if (t.badRepeat) parts.push(`<span class="overdue">Can't read the repeat "${esc(t.badRepeat)}" — fix it in the Sheet</span>`);
  return parts.length ? `<span class="meta">${parts.join(" &nbsp;")}</span>` : "";
}
function isDailyRepeat(t) {
  const r = t.repeat && parseRepeat(t.repeat);
  return !!r && r.unit === "day" && r.n === 1;
}
/* ---------- due times, subtasks and order ---------- */
function fmtTime(t) {
  const m = /^(\d{2}):(\d{2})$/.exec(t || "");
  if (!m) return "";
  const h = Number(m[1]);
  return `${h % 12 || 12}:${m[2]} ${h < 12 ? "AM" : "PM"}`;
}
function timeMin(t) { const m = /^(\d{2}):(\d{2})$/.exec(t || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : -1; }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
/* Late: a day gone by, or today's time gone by. A task with no time is late only after its day. */
function isLate(t) {
  if (!t.due || t.completed) return false;
  const today = todayStr();
  return t.due < today || (t.due === today && !!t.time && t.time < nowHM());
}
const taskById = id => DATA.tasks.find(t => t.id === id);
const isSub = t => !!t.parentId && !!taskById(t.parentId); // a subtask whose parent is gone stands as a task of its own
const subsOf = id => DATA.tasks.filter(t => t.parentId === id);
const tops = () => DATA.tasks.filter(t => !isSub(t));
const sortKey = t => t.sort == null ? 1e9 : t.sort;
/* Subtasks: open ones first, then the order they were put in. */
const subOrder = (a, b) => !!a.completed - !!b.completed || sortKey(a) - sortKey(b);
/* Tasks by day, then time (no time first, like an all-day event), then the order set by dragging. */
const cmpTask = (a, b) => (a.due || "9").localeCompare(b.due || "9") || (a.time || "").localeCompare(b.time || "") ||
  sortKey(a) - sortKey(b) || String(a.title).localeCompare(String(b.title));
const byDue = cmpTask;

/* ============ views ============ */
const VIEWS = {
  today: { label: "Today", title: () => "Today", render: renderToday },
  calendar: { label: "Calendar", title: () => "Calendar", render: renderCalendar },
  meals: { label: "Dinner", title: () => "This Week's Dinners", render: renderMeals },
  tasks: { label: "Tasks", title: () => "Tasks", render: renderTasks },
  checkins: { label: "Check-in", title: () => "Check-Ins", render: renderCheckins },
};

function render() {
  if (TD) return; // mid-drag: the rows stay put under the finger; the drop renders
  const v = VIEWS[VIEW];
  document.getElementById("viewTitle").textContent = v.title();
  document.getElementById("todayEyebrow").textContent =
    new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  document.getElementById("main").innerHTML = v.render();
  restoreDraft();
  document.querySelectorAll("#main .meal input").forEach(mealLinks);
  if (VIEW === "tasks") repeatUI();
  document.getElementById("main").addEventListener("input", saveDraft);
  document.getElementById("nav").innerHTML = Object.keys(VIEWS).map(k =>
    `<button class="${k === VIEW ? "active" : ""}" onclick="go('${k}')">${VIEWS[k].label}</button>`).join("");
}
function go(v) { VIEW = v; render(); window.scrollTo(0, 0); }

/* ----- Today ----- */
function renderToday() {
  const t = todayStr();
  const dayIdx = (new Date().getDay() + 6) % 7;
  const dinner = (DATA.meals[DAYS[dayIdx]] || {}).meal;
  const todaysEvents = DATA.events.filter(e => e.date === t);
  // Subtasks show under their parents, so only top-level tasks are sorted into these lists.
  const top = tops();
  const daily = top.filter(x => x.recurrence === "daily" || isDailyRepeat(x));
  // Dated tasks once they're due (overdue first); undated one-offs as before.
  const oneOff = top.filter(x => !x.completed && !isDailyRepeat(x) &&
      (x.due ? x.due <= t : x.recurrence === "once")).sort(cmpTask);
  const onDeck = top.filter(x => ["weekly", "monthly", "quarterly", "yearly"].includes(x.recurrence) && !x.completed);

  const tonight = mealParts(dinner);
  let h = `<div class="lineup"><span class="marker now">Tonight</span>
    <h3>${dinner ? esc(tonight.name || "Tonight's recipe") : "Dinner isn't planned yet"}</h3>${recipeLinks(tonight.links)}
    ${dinner ? "" : `<div class="muted">Tap Dinner below to fill in the week.</div>`}</div>`;

  h += `<h2>Today's schedule</h2>`;
  h += todaysEvents.length ? `<div class="block">${todaysEvents.map(eventRow).join("")}</div>`
                           : `<div class="block"><div class="empty">Nothing on the calendar today.</div></div>`;

  h += `<h2>Daily rhythm</h2>`;
  h += daily.length ? `<div class="block">${daily.map(taskRow).join("")}</div>`
                    : `<div class="block"><div class="empty">No daily tasks yet — add some in Tasks.</div></div>`;

  // Jon's reminders due today or overdue join the to-dos, ticked ones last.
  const rems = reminderTops().filter(r => r.due && r.due <= t);
  const todos = mixRows(oneOff, rems);
  if (todos.length) h += `<h2>To-dos</h2>${remStale()}<div class="block">${todos.join("")}</div>`;
  else h += `<h2>To-dos</h2>${remStale()}<div class="block"><div class="empty good">Nothing outstanding today.</div></div>`;
  if (onDeck.length) h += `<h2>On deck this period</h2><div class="block">${onDeck.map(taskRow).join("")}</div>`;
  return h;
}

/* ----- Calendar ----- */
function renderCalendar() {
  if (!DATA.events.length) return `<div class="block"><div class="empty">No events in the next two weeks — or the calendars aren't connected yet.</div></div>`;
  const byDay = {};
  DATA.events.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const t = todayStr();
  return Object.keys(byDay).sort().map(d =>
    `<div class="dayhead">${dayLabel(d)}${d === t ? '<span class="marker now">Today</span>' : ""}</div>
     <div class="block">${byDay[d].map(eventRow).join("")}</div>`).join("");
}

/* ----- Meals ----- */
function renderMeals() {
  const dayIdx = (new Date().getDay() + 6) % 7;
  const rows = DAYS.map((d, i) => {
    const m = DATA.meals[d] || {};
    return `<div class="meal ${i === dayIdx ? "today" : ""}">
      <span class="d">${d}</span>
      <div class="mealbody">
        <input type="text" id="meal-${d}" value="${esc(m.meal)}" placeholder="Dinner, or paste a recipe link…" oninput="mealLinks(this)">
        <div id="meal-${d}-links"></div>
      </div>
    </div>`;
  }).join("");

/* Reordering: press the grip and drag. Pointer events cover touch and mouse;
   the other unchecked rows slide aside to show where the item will land. */
let DRAG = null;
function dragStart(e, id) {
  if (id.startsWith("tmp-") || DRAG) return; // still saving
  e.preventDefault();
  const row = e.currentTarget.closest(".task");
  const rows = [...row.parentElement.querySelectorAll(".task:not(.done)")];
  const from = rows.indexOf(row);
  e.currentTarget.setPointerCapture(e.pointerId);
  DRAG = { row, rows, from, to: from, startY: e.clientY,
    ids: rows.map(r => r.querySelector(".grip").dataset.grip), // what was on screen when the drag began
    h: row.getBoundingClientRect().height,
    mids: rows.map(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2; }) };
  row.classList.add("dragging");
}
function dragMove(e) {
  if (!DRAG) return;
  const { row, rows, from, mids, h } = DRAG;
  const dy = e.clientY - DRAG.startY;
  const center = mids[from] + dy;
  const to = rows.filter((r, i) => i !== from && mids[i] < center).length;
  row.style.transform = `translateY(${dy}px)`;
  rows.forEach((r, i) => {
    if (r === row) return;
    const shift = from < to && i > from && i <= to ? -h : from > to && i >= to && i < from ? h : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
  DRAG.to = to;
}
function dragEnd() {
  if (!DRAG) return;
  const { from, to, rows, ids } = DRAG;
  DRAG = null;
  rows.forEach(r => { r.style.transform = ""; r.classList.remove("dragging"); });
  if (from === to) { render(); return; } // picks up anything a refresh brought in mid-drag
  const [id] = ids.splice(from, 1);
  ids.splice(to, 0, id);
  applyOrder(ids);
}
function gripKey(e, id) {
  const step = { ArrowUp: -1, ArrowDown: 1 }[e.key];
  if (!step || id.startsWith("tmp-")) return;
  e.preventDefault();
  const ids = DATA.groceries.filter(g => !g.done).map(g => g.id);
  const from = ids.indexOf(id), to = from + step;
  if (from < 0 || to < 0 || to >= ids.length) return;
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  const refocus = () => { const b = document.querySelector(`[data-grip="${id}"]`); if (b) b.focus(); };
  applyOrder(ids).then(refocus);
  refocus();
}
/* Puts the unchecked items in the given order, matched by id rather than position,
   so a refresh that changed the list mid-drag can't move the wrong item. Items
   the order doesn't name (added meanwhile) keep their place after the rest. */
function applyOrder(ids) {
  const pos = new Map(ids.map((id, i) => [id, i]));
  const rank = g => pos.has(g.id) ? pos.get(g.id) : ids.length;
  const left = DATA.groceries.filter(g => !g.done).sort((a, b) => rank(a) - rank(b));
  DATA.groceries = left.concat(DATA.groceries.filter(g => g.done));
  ORDER_WANT = DATA.groceries.filter(g => !g.id.startsWith("tmp-")).map(g => g.id);
  render();
  return saveOrder();
}
/* One reorder save at a time, always sending the newest order. A save that a
   later move has superseded is skipped, and only the last answer is shown. */
let ORDER_WANT = null, ORDER_SEQ = 0, ORDER_Q = Promise.resolve();
function saveOrder() {
  const seq = ++ORDER_SEQ;
  note("Saving…");
  ORDER_Q = ORDER_Q.then(async () => {
    if (seq !== ORDER_SEQ) return;
    try {
      const d = await apiPost({ action: "reorderGroceries", ids: ORDER_WANT });
      if (seq !== ORDER_SEQ) return;
      if (!d.ok) { note("Save failed"); return; }
      DATA.groceries = d.groceries;
      localStorage.setItem("fd_cache", JSON.stringify(DATA));
      note("Saved ✓");
      if (!DRAG) render();
    } catch (e) {
      if (seq === ORDER_SEQ) note("Save failed — offline?");
    }
  });
  return ORDER_Q;
}

/* ----- Jon's Apple Reminders -----

  get show() { const v = localStorage.getItem("fd_rem_show"); return v == null ? ["Jon", "Maggie"].includes(cfg.user) : v === "1"; },
  get hidden() { try { return JSON.parse(localStorage.getItem("fd_rem_hidden") || "[]"); } catch (e) { return []; } },

async function tickReminder(key, on) {

/* ----- Dragging tasks -----
   Press a task's handle and drag. Where it's dropped decides what happens:
   - onto the middle of a task: it becomes that task's last subtask
   - between tasks: it goes there, taking that spot's day and time
     (beside a subtask, it becomes a subtask of the same parent)
   - onto Today, Tomorrow, Next week or No date in the bar that appears: a new day
   Subtasks go one level deep. Arrow keys on the handle do the same moves. */
let TD = null;
const TD_EDGE = 0.28; // the top and bottom of a row (as a share of its height) place beside it; the middle nests
const TD_DATES = [["Today", 0], ["Tomorrow", 1], ["Next week", 7], ["No date", null]];

/* What dropping task t beside (or into) task r would do, or null if it can't go there. */
function planPlace(t, r, where) {
  if (!r || r.id === t.id || r.completed) return null;
  const hasSubs = subsOf(t.id).length > 0, ids = list => list.map(x => x.id);
  const open = x => !x.completed && x.id !== t.id;
  if (where === "into") {
    if (hasSubs || isSub(r)) return null;
    return { parentId: r.id, due: t.due || "", time: t.time || "",
      order: ids(subsOf(r.id).filter(open).sort(subOrder).concat(t)), hint: `Make it a subtask of “${r.title}”` };
  }
  if (isSub(r)) {
    if (hasSubs) return null;
    const sibs = subsOf(r.parentId).filter(open).sort(subOrder);
    sibs.splice(sibs.indexOf(r) + (where === "after" ? 1 : 0), 0, t);
    return { parentId: r.parentId, due: t.due || "", time: t.time || "", order: ids(sibs),
      hint: t.parentId === r.parentId ? "Move it here" : `Make it a subtask of “${taskById(r.parentId).title}”` };
  }
  // Beside a top-level task: it takes that task's day and time, so it sorts where it's dropped.
  let due = t.due || "", time = t.time || "";
  if (r.due) {
    if (t.recurrence !== "once" && t.recurrence !== "repeat") return null; // the Sheet's own daily/weekly lists keep no date
    due = r.due; time = r.time || "";
  } else if (due || t.recurrence !== r.recurrence) return null; // undated lists only reorder
  const group = tops().filter(x => open(x) && (x.due || "") === due && (x.time || "") === time &&
    (due || x.recurrence === t.recurrence)).sort(cmpTask);
  group.splice(group.indexOf(r) + (where === "after" ? 1 : 0), 0, t);

/* What dropping task t on a day in the bar would do. */

  if (!due && t.repeat) return null; // a repeating task always has a next date
  const time = due ? t.time || "" : "";
  const group = tops().filter(x => !x.completed && x.id !== t.id && (x.due || "") === due && (x.time || "") === time &&
    (due || x.recurrence === "once")).sort(cmpTask).concat(t);

}

  if (isSub(t)) parts.push("Take it out of “" + taskById(t.parentId).title + "”");
  if (due !== (t.due || "") || time !== (t.time || "")) {
    parts.push(due ? "Due " + dueInfo(due).text + (time ? " · " + fmtTime(time) : "") : "No due date");

}

  const body = { action: "updateTask", id: t.id, order: plan.order.filter(id => !String(id).startsWith("tmp-")) };
  if ((isSub(t) ? t.parentId : "") !== plan.parentId) body.parentId = plan.parentId;
  if (plan.parentId) foldTask(plan.parentId, false);
  if ((t.due || "") !== plan.due) body.due = plan.due;
  if ((t.time || "") !== plan.time) body.time = plan.time;
  if (t.repeat && "due" in body) t.completed = false;
  Object.assign(t, { parentId: plan.parentId, due: plan.due, time: plan.time });
  plan.order.forEach((id, i) => { const x = taskById(id); if (x) x.sort = i + 1; });

function tdStart(e, id) {
  const t = taskById(id);

  e.preventDefault();
  const row = e.currentTarget.closest(".task");
  e.currentTarget.setPointerCapture(e.pointerId);
  // The task and its fold of subtasks move together, and can't be dropped on themselves.
  const fold = r => r.nextElementSibling && r.nextElementSibling.matches("details.tsubs") ? r.nextElementSibling : null;
  const group = [row, fold(row)].filter(Boolean);
  const sy = window.scrollY;
  const rows = [...document.querySelectorAll("#main .task[data-tid]")]
    .filter(r => !group.some(g => g.contains(r)) && !r.classList.contains("done") && !r.closest("details:not([open])")) // nor a folded subtask
    .map(r => { const b = r.getBoundingClientRect(), f = fold(r);
      return { el: r, id: r.dataset.tid, parent: r.dataset.parent || "", top: b.top + sy, bottom: b.bottom + sy, left: b.left, width: b.width,
        end: (f ? f.getBoundingClientRect().bottom : b.bottom) + sy }; });
  const bar = document.createElement("div");
  bar.className = "td-bar";
  bar.innerHTML = `<div class="td-hint" id="tdHint" role="status">Drop onto a task to make it a subtask</div>
    <div class="td-chips">${TD_DATES.map(([label, days]) => {
      const due = days == null ? "" : isoPlus(todayStr(), days);
      return `<div class="td-chip ${planDate(t, due) ? "" : "off"}" data-due="${due}">${label}</div>`;
    }).join("")}</div>`;
  document.body.appendChild(bar);
  const line = document.createElement("div");
  line.className = "drop-line hidden";
  document.body.appendChild(line);
  TD = { t, group, rows, bar, line, sx: e.clientX, sy: e.clientY, scroll0: sy, x: e.clientX, y: e.clientY, plan: null, into: null, raf: 0 };
  row.classList.add("dragging");
  group.slice(1).forEach(r => r.classList.add("dragging-sub"));
  tdLoop();
}
function tdMove(e) {
  if (!TD) return;
  TD.x = e.clientX; TD.y = e.clientY;
  tdUpdate();
}
function tdUpdate() {
  const dy = TD.y - TD.sy + window.scrollY - TD.scroll0, dx = (TD.x - TD.sx) * 0.3;
  TD.group.forEach(r => { r.style.transform = `translate(${dx}px, ${dy}px)`; });
  let plan = null, into = null, lineAt = null;
  // On a day in the bar?
  TD.bar.querySelectorAll(".td-chip").forEach(c => {
    const b = c.getBoundingClientRect(), hit = TD.x >= b.left && TD.x <= b.right && TD.y >= b.top && TD.y <= b.bottom;
    const p = hit && planDate(TD.t, c.dataset.due);
    c.classList.toggle("on", !!p);
    if (p) plan = p;
  });
  // Over a row?
  const y = TD.y + window.scrollY, r = !plan && TD.y > TD.bar.getBoundingClientRect().bottom && TD.rows.find(x => y >= x.top && y < x.bottom);
  if (r) {
    const f = (y - r.top) / (r.bottom - r.top), target = taskById(r.id);
    if (r.parent) {

    } else if (f > TD_EDGE && f < 1 - TD_EDGE) {

  if (showLine) Object.assign(TD.line.style, { top: lineAt.y + "px", left: lineAt.r.left + "px", width: lineAt.r.width + "px" });

  group.forEach(r => { r.style.transform = ""; r.classList.remove("dragging", "dragging-sub"); });

/* The same moves from the keyboard: up and down within the list, right to go

function tdKey(e, id) {
  const t = taskById(id);
  if (!t || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  if (String(id).startsWith("tmp-") || TD) return;
  const row = e.currentTarget.closest(".task");
  const peers = [...row.parentElement.querySelectorAll(".task[data-tid]:not(.done)")]
    .filter(r => (r.dataset.parent || "") === (row.dataset.parent || ""));
  const at = peers.indexOf(row), above = peers[at - 1], below = peers[at + 1];
  let plan = null;
  if (e.key === "ArrowUp" && above) plan = planPlace(t, taskById(above.dataset.tid), "before");
  if (e.key === "ArrowDown" && below) plan = planPlace(t, taskById(below.dataset.tid), "after");
  if (e.key === "ArrowRight" && !row.dataset.parent && above) plan = planPlace(t, taskById(above.dataset.tid), "into");
  if (e.key === "ArrowLeft" && isSub(t)) plan = planPlace(t, taskById(t.parentId), "after");
  if (!plan) return;
  const refocus = () => { const b = document.querySelector(`[data-tgrip="${CSS.escape(id)}"]`); if (b) b.focus(); };
  note(plan.hint);
  commitPlan(t, plan).then(refocus);
  refocus();
}

      }).join("");
      const nice = /^\d{4}-\d{2}-\d{2}$/.test(c.date)
        ? new Date(c.date + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" })
        : c.date;
      return `<details class="hist"><summary>${esc(nice)} · ${label}</summary>
        <div class="ans">${parts || '<span class="tiny">Completed — no notes saved.</span>'}</div></details>`;
    }).join("") + `</div>`;
  }
  return h;
}
function openCheckin(type) { CHECKIN_OPEN = type; render(); }
function closeCheckin() {
  if (localStorage.getItem("fd_draft_" + CHECKIN_OPEN) && !confirm("Discard your notes for this check-in?")) return;
  clearDraft("fd_draft_" + CHECKIN_OPEN); CHECKIN_OPEN = null; render();
}

function renderHuddleForm() {
  const rows = HUDDLE_FIELDS.map(([key, title, hint], i) =>
    `<div class="q"><span class="num">${i + 1}</span><div class="body">
      <p>${title}</p><div class="tiny" style="margin:-4px 0 6px">${hint}</div>
      <textarea id="hud-${key}" placeholder="Notes (optional)"></textarea></div></div>`).join("");
  return `<div class="lineup"><span class="marker team">Everyone</span>
      <h3>Family Huddle</h3>
      <div class="muted">Clayton is Calendar Captain · Heidi is Fun Picker. Notes are optional — saving marks this week done.</div></div>
    <div class="block">${rows}</div>
    <div class="actions">
      <button class="primary" onclick="saveCheckin('huddle')">Save huddle</button>
      <button class="ghost" onclick="closeCheckin()">Cancel</button>
    </div>`;
}
function renderCouplesForm() {
  const rows = COUPLES_QUESTIONS.map((q, i) =>
    `<div class="q"><span class="num">${i + 1}</span><div class="body">
      <p>${q}</p><textarea id="cpl-q${i}" placeholder="Notes (optional)"></textarea></div></div>`).join("");
  return `<div class="lineup"><span class="marker ceremony">Jon &amp; Maggie</span>
      <h3>Weekly Check-In</h3>
      <div class="muted">Part one: the seven questions. Big topics get their own time. Hard stop at 30.</div></div>
    <div class="block">${rows}</div>
    <div class="actions">
      <button class="primary" onclick="saveCheckin('couples')">Save check-in</button>
      <button class="ghost" onclick="closeCheckin()">Cancel</button>
    </div>`;
}
function saveCheckin(type) {
  const answers = {};
  if (type === "huddle") HUDDLE_FIELDS.forEach(([k]) => { answers[k] = document.getElementById("hud-" + k).value.trim(); });
  else COUPLES_QUESTIONS.forEach((_, i) => { answers["q" + i] = document.getElementById("cpl-q" + i).value.trim(); });
  clearDraft("fd_draft_" + type);
  CHECKIN_OPEN = null;
  send({ action: "saveCheckin", type, answers });
}

/* ============ setup & settings ============ */
function overlayHtml(inner) {
  document.getElementById("overlayPage").innerHTML = inner;
  document.getElementById("overlay").classList.remove("hidden");
}
function closeOverlay() { document.getElementById("overlay").classList.add("hidden"); }

function showSetup() {
  overlayHtml(`
    <header><span class="eyebrow">Harper Family Hub</span><h1>One-time setup</h1>
      <div class="subtitle">Do this once per device — it's remembered after that.</div></header>
    <label class="f">Apps Script web app URL</label>
    <input type="url" id="setApi" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.api)}">
    <label class="f">Family PIN</label>
    <input type="password" id="setPin" inputmode="numeric" value="${esc(cfg.pin)}">
    <label class="f">This device belongs to</label>
    <select id="setUser">${FAMILY.slice(0, 4).map(f => `<option ${f === cfg.user ? "selected" : ""}>${f}</option>`).join("")}</select>
    <div class="actions"><button class="primary" onclick="saveSetup()">Connect</button></div>`);
}
function saveSetup() {
  localStorage.setItem("fd_api", document.getElementById("setApi").value.trim());
  localStorage.setItem("fd_pin", document.getElementById("setPin").value.trim());
  localStorage.setItem("fd_user", document.getElementById("setUser").value);
  closeOverlay();
  refresh();
  syncPush();
}
function openSettings() {
  overlayHtml(`
    <header><span class="eyebrow">Settings</span></header>
    <label class="f">Apps Script web app URL</label>
    <input type="url" id="setApi" value="${esc(cfg.api)}">
    <label class="f">Family PIN</label>
    <input type="password" id="setPin" value="${esc(cfg.pin)}">
    <label class="f">This device belongs to</label>
    <select id="setUser">${FAMILY.slice(0, 4).map(f => `<option ${f === cfg.user ? "selected" : ""}>${f}</option>`).join("")}</select>
    <div class="actions">
      <button class="primary" onclick="saveSetup()">Save</button>
      <button class="ghost" onclick="closeOverlay()">Cancel</button>
    </div>
    <div class="tiny" style="margin-top:var(--space-5)">Data refreshes every 60 seconds and whenever the app is reopened.</div>
    <h2>Reminders<span class="hint">on this device</span></h2>
    <div id="remBox"><div class="block">${remSettingsHtml()}</div></div>
    <h2>Notifications<span class="hint">for ${esc(cfg.user)}</span></h2>
    <div id="notifyBox"><div class="empty">Loading…</div></div>`);
  loadNotify();
}

/* ============ notifications ============ */
let NOTIFY = null; // { publicKey, ready, lastTick, parents, prefs, devices } from the server
const NOTIFY_ROWS = [
  ["summary", "Morning summary", "Your to-dos, the kids', today's calendar and dinner", "time"], // Jon's adds his reminders
  ["dinner", "Dinner nudge", "Only if tonight's dinner isn't planned", "time"],
  ["huddle", "Family Huddle reminder", "Skipped once this week's huddle is saved", "day"],
  ["couples", "Weekly Check-In reminder", "Skipped once this week's check-in is saved", "day"],
  ["assigned", "New to-dos", "When someone adds one for you or the family", ""],
  ["meals", "Meal plan ready", "Once every day has a dinner and the plan has sat unchanged for 10 minutes", ""],
];

async function loadNotify() {
  const box = document.getElementById("notifyBox");
  try {
    const d = await apiGet("notify");
    if (!d.ok) throw new Error(d.error);
    NOTIFY = d;
  } catch (e) {
    box.innerHTML = `<div class="empty">Couldn't load notification settings — check the connection above.</div>`;
    return;
  }
  if (!NOTIFY.prefs) {
    box.innerHTML = `<div class="empty">The Apps Script backend needs updating before notifications can be turned on.</div>`;
    return;
  }
  const p = NOTIFY.prefs[cfg.user];
  const time = (k, f, label) => `<input type="time" id="n-${k}-${f}" value="${esc(p[k][f])}" aria-label="${esc(label)}">`;
  const rows = NOTIFY_ROWS.filter(([k]) => k !== "couples" || NOTIFY.parents.includes(cfg.user)).map(([k, label, hint, when]) => {
    const day = when === "day" ? `<select id="n-${k}-day" aria-label="${esc(label)} day">${DAYS.map(d =>
      `<option ${d === p[k].day ? "selected" : ""}>${d}</option>`).join("")}</select>` : "";
    if (k === "summary" && cfg.user === "Jon") hint = hint.replace(" and dinner", ", dinner and your reminders");
    return `<div class="nrow">
      <label class="ncheck"><input type="checkbox" id="n-${k}-on" ${p[k].on ? "checked" : ""}>
        <span class="ttl">${label}<span class="tiny">${hint}</span></span></label>
      ${when ? `<div class="nwhen">${day}${time(k, "at", label + " time")}</div>` : ""}
    </div>`;
  }).join("");
  box.innerHTML = `<div class="sheet" id="pushState"><div class="muted">Checking this device…</div></div>
    <div class="block">${rows}
      <div class="nrow">
        <label class="ncheck"><input type="checkbox" id="n-quiet-on" ${p.quiet.on ? "checked" : ""}>
          <span class="ttl">Quiet hours<span class="tiny">New to-do and meal-plan alerts wait until quiet hours end. Reminders still come at the times you set above.</span></span></label>
        <div class="nwhen">${time("quiet", "from", "Quiet hours start")}<span class="muted">to</span>${time("quiet", "to", "Quiet hours end")}</div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" onclick="saveNotifyPrefs()">Save notification settings</button>
      <span class="tiny" id="prefsMsg" role="status"></span>
    </div>`;
  renderPushState();
}

async function pushStatus() {
  if (!NOTIFY.ready) return "server";
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "unsupported";
  if (Notification.permission === "denied") return "blocked";
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return sub && Notification.permission === "granted" ? "on" : "off";
}

async function renderPushState(msg) {
  const el = document.getElementById("pushState");
  if (!el) return;
  const state = await pushStatus();
  const text = {
    server: "Notifications aren't connected on the server yet. Finish the setup in the repo's apps-script/README.md.",
    unsupported: "Notifications need the Home Screen app. Open Family Hub from its Home Screen icon (iPhone: iOS 16.4 or later) and come back here.",
    blocked: "Notifications are blocked for Family Hub. Turn them on in the iPhone's Settings → Notifications → Family Hub, then come back here.",
    off: "Off on this device.",
    on: "On for this device.",
  }[state];
  const buttons = {
    off: `<button class="primary" onclick="enablePush()">Turn on notifications</button>`,
    on: `<button class="ghost" onclick="sendTestPush()">Send a test</button>
         <button class="ghost" onclick="disablePush()">Turn off here</button>`,
  }[state] || "";
  const stale = state === "on" && (!NOTIFY.lastTick || Date.now() - NOTIFY.lastTick > 30 * 60000)
    ? `<div class="tiny" style="color:var(--warn);margin-top:var(--space-2)">Scheduled reminders aren't running yet — run setupNotifications in the Apps Script editor.</div>` : "";
  el.innerHTML = `<span class="marker ${state === "on" ? "team" : "scheduled"}">${state === "on" ? "On" : "Off"}</span>
    <div class="muted">${text}</div>${stale}
    ${buttons ? `<div class="actions">${buttons}</div>` : ""}
    <div class="tiny" id="pushMsg" role="status" style="margin-top:var(--space-2)">${esc(msg || "")}</div>`;
}

function say(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }

function b64uBytes(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

async function enablePush() {
  try {
    // Must be the first await: iOS only asks from a direct tap.
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { renderPushState(); return; }
    say("pushMsg", "Turning on…");
    const reg = await navigator.serviceWorker.ready;
    const key = b64uBytes(NOTIFY.publicKey);
    let sub = await reg.pushManager.getSubscription();
    const oldKey = sub && sub.options && sub.options.applicationServerKey;
    if (sub && oldKey && new Uint8Array(oldKey).join() !== key.join()) { await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const d = await apiPost({ action: "pushSubscribe", person: cfg.user, subscription: sub.toJSON() });
    if (!d.ok) throw new Error(d.error);
    localStorage.setItem("fd_push_sync", cfg.user + "|" + todayStr());
    renderPushState("Turned on ✓ — try Send a test.");
  } catch (e) {
    say("pushMsg", "Couldn't turn on notifications (" + e.message + ").");
  }
}

async function sendTestPush() {
  say("pushMsg", "Sending…");
  try {
    const d = await apiPost({ action: "pushTest", person: cfg.user });
    const s = d.sent || {};
    say("pushMsg", s.delivered ? `Sent to ${s.delivered} device${s.delivered > 1 ? "s" : ""} ✓`
      : "Didn't send — " + (s.error || "no devices signed up"));
  } catch (e) { say("pushMsg", "Couldn't send — offline?"); }
}

async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await apiPost({ action: "pushUnsubscribe", endpoint: sub.endpoint }).catch(() => {});
      await sub.unsubscribe();
    }
    localStorage.removeItem("fd_push_sync");
    renderPushState("Turned off for this device.");
  } catch (e) { say("pushMsg", "Couldn't turn off (" + e.message + ")."); }
}

async function saveNotifyPrefs() {
  const p = JSON.parse(JSON.stringify(NOTIFY.prefs[cfg.user]));
  Object.keys(p).forEach(k => {
    const on = document.getElementById(`n-${k}-on`);
    if (on) p[k].on = on.checked;
    ["at", "day", "from", "to"].forEach(f => {
      const el = document.getElementById(`n-${k}-${f}`);
      if (el && el.value) p[k][f] = el.value.slice(0, 5);
    });
  });
  say("prefsMsg", "Saving…");
  try {
    const d = await apiPost({ action: "savePrefs", person: cfg.user, prefs: p });
    if (!d.ok) throw new Error(d.error);
    NOTIFY.prefs[cfg.user] = d.prefs;
    say("prefsMsg", "Saved ✓");
  } catch (e) { say("prefsMsg", "Couldn't save — " + (e.message || "offline?")); }
}

/* Re-register this device once a day (and when its person changes), so the
   server's list stays current even if a subscription rotates. */
async function syncPush() {
  try {
    if (!cfg.api || !cfg.pin || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
    if (Notification.permission !== "granted") return;
    const key = cfg.user + "|" + todayStr();
    if (localStorage.getItem("fd_push_sync") === key) return;
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (!sub) return;
    const d = await apiPost({ action: "pushSubscribe", person: cfg.user, subscription: sub.toJSON() });
    if (d.ok) localStorage.setItem("fd_push_sync", key);
  } catch (e) {}
}

/* A tapped notification opens the screen it's about. */
function openFromNotification(d) {
  if (!d || !VIEWS[d.view]) return;
  closeOverlay();
  if (d.checkin === "huddle" || d.checkin === "couples") CHECKIN_OPEN = d.checkin;
  go(d.view);
}

/* ============ boot ============ */
(function boot() {
  const cached = localStorage.getItem("fd_cache");
  if (cached) { try { DATA = JSON.parse(cached); } catch (e) {} }
  const [view, checkin] = location.hash.slice(1).split("/"); // from a tapped notification
  if (VIEWS[view]) {
    VIEW = view;
    if (checkin === "huddle" || checkin === "couples") CHECKIN_OPEN = checkin;
    history.replaceState(null, "", location.pathname);
  }
  render();
  refresh(true);
  POLL = setInterval(() => { if (document.visibilityState === "visible") refresh(true); }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refresh(true);
  });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    navigator.serviceWorker.addEventListener("message", e => openFromNotification(e.data));
  }
  syncPush();
})();
</script>
