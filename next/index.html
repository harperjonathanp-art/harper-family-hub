<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Harper Family Hub</title>
<!-- The redesign's preview (see the build plan). The live Hub is ../index.html; both share sign-in and data. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="description" content="What today asks of four people.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f0e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Every file carries the release number, so a new page never runs with an old file. -->
<script src="js/theme.js?v=16"></script>
<link rel="stylesheet" href="css/themes.css?v=16">
<link rel="stylesheet" href="css/app.css?v=16">
</head>
<body>

<div class="page" id="app">
  <header>
    <div class="header-row">
      <span class="eyebrow" id="todayEyebrow">Harper Family Hub</span>
      <span class="header-tools">
        <!-- Sync state (js/data.js note()): tap to sync now. -->
        <button type="button" class="syncpill" id="syncNote" data-state="busy" onclick="refresh(false, true)" aria-label="Syncing. Tap to sync now.">
          <span class="dot" aria-hidden="true"></span><span class="txt">Syncing…</span></button>
        <button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙</button>
      </span>
    </div>
    <h1 id="viewTitle">Today</h1>
  </header>
  <main id="main"></main>
</div>

<!-- Pull down to refresh (js/shell.js). -->
<div class="pull" id="pull" aria-hidden="true">
  <svg class="pull-arrow" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  <svg class="pull-spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
  <svg class="pull-done" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</div>

<nav id="nav" aria-label="Sections"></nav>

<!-- Settings, Edit task and sign-in rise from the bottom (js/shell.js). -->
<div class="panel-back hidden" id="panelBack" onclick="panelBackTap()"></div>
<div class="panel hidden" id="overlay" role="dialog" aria-modal="true" aria-label="Panel" tabindex="-1">
  <div class="panel-grab" aria-hidden="true" onpointerdown="panelGrab(event)" onpointermove="panelPull(event)"
       onpointerup="panelLetGo()" onpointercancel="panelLetGo()"></div>
  <div class="page" id="overlayPage"></div>
</div>

<!-- Tells VoiceOver which screen just opened. -->
<div id="srAnnounce" class="sr-only" aria-live="polite"></div>

<!-- In order: data and helpers first, each screen, Settings, then the start. -->
<script src="js/data.js?v=16" defer></script>
<script src="js/shell.js?v=16" defer></script>
<script src="js/today.js?v=16" defer></script>
<script src="js/calendar.js?v=16" defer></script>
<script src="js/dinner.js?v=16" defer></script>
<script src="js/tasks.js?v=16" defer></script>
<script src="js/checkins.js?v=16" defer></script>
<script src="js/settings.js?v=16" defer></script>
<script src="js/boot.js?v=16" defer></script>
</body>
</html>
